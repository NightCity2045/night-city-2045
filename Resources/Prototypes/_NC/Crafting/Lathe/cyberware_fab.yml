- type: entity
  id: NCCyberwareFabMachine
  parent: [Protolathe, BaseMaterialSiloUtilizer]
  name: ent-NCCyberwareFab
  description: ent-NCCyberwareFab-desc
  components:
  - type: Sprite
    sprite: Structures/Machines/protolathe.rsi
    snapCardinals: true
  - type: Machine
    board: NCCyberwareFabCircuitboard
  - type: Lathe
    idleState: icon
    runningState: building
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - NCCyberwarePack
    dynamicPacks: []

- type: entity
  id: NCCyberwareFabCircuitboard
  parent: BaseMachineCircuitboard
  name: ent-NCCyberwareFabCircuitboard
  description: ent-NCCyberwareFabCircuitboard-desc
  components:
  - type: Sprite
    state: medical
  - type: MachineBoard
    prototype: NCCyberwareFabMachine
    machinePartRequirements:
      MatterBin: 2
      Manipulator: 2
    tagRequirements:
      GlassBeaker:
        amount: 2
        defaultPrototype: Beaker
  - type: StealTarget
    stealGroup: NCCyberwareFabCircuitboard

