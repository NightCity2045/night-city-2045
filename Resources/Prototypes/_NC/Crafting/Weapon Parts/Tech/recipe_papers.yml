- type: entity
  parent: Paper
  id: NCRecipePaperBase
  abstract: true
  name: ent-NCRecipePaperBase
  description: ent-NCRecipePaperBase-desc
  components:
  - type: Sprite
    sprite: Objects/Misc/bureaucracy.rsi
    layers:
    - state: paper
    - state: paper_words
