- type: htnCompound
  id: NCNetDemonPursuitCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:CoordinatesNotInRangePrecondition
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
      operator: !type:MoveToOperator
        # Digital room grids are not guaranteed to have a path available while
        # the HTN plan is assembled. Steering requests it after movement starts.
        pathfindInPlanning: false
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
        removeKeyOnFinish: false

  - tasks:
    - !type:HTNPrimitiveTask
      preconditions:
      - !type:CoordinatesInRangePrecondition
        targetKey: FollowTarget
        rangeKey: FollowCloseRange
      operator: !type:WaitOperator
        key: NetDemonWait
