- type: entity
  id: ActionToggleSandevistan
  name: action-name-sandevistan
  description: action-desc-sandevistan
  components:
  - type: InstantAction
    icon: { sprite: _NC/Objects/Cyberware/sandevistan.rsi, state: icon }
    event: !type:SandevistanToggleActionEvent
    checkCanInteract: false
    useDelay: 1.0

- type: entity
  id: ActionNetJackOut
  name: action-name-net-jackout
  description: action-desc-net-jackout
  components:
  - type: InstantAction
    icon: { sprite: Interface/Actions/actions_ai.rsi, state: ghost_unpossess }
    event: !type:JackOutActionEvent
    checkCanInteract: false
    useDelay: 5.0

- type: entity
  id: ActionOpenLinkedCyberdeck
  name: Open Cyberdeck
  description: Open the linked cyberdeck interface while immersed.
  components:
  - type: InstantAction
    icon: { sprite: Objects/Devices/pda.rsi, state: pda-detective }
    event: !type:OpenLinkedCyberdeckActionEvent
    checkCanInteract: false
    useDelay: 0.5
