# region Abstract

- type: entity
  parent: [DrinkCartonVisualsOpenable, DrinkCartonBaseFull]
  id: NCFertilizerBag
  name: ent-NCFertilizerBag
  description: ent-NCFertilizerBag-desc
  suffix: мешок удобрений
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        maxVol: 50
  - type: Sprite
    sprite: _NC/Objects/Tools/fertilizers.rsi

# region Fertilizers

- type: entity
  parent: NCFertilizerBag
  id: NCFertilizerBagPotency
  name: ent-NCFertilizerPotent
  description: ent-NCFertilizerPotent-desc
  suffix: мешок удобрений
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: RobustHarvest
          Quantity: 30
        - ReagentId: Sugar
          Quantity: 20
  - type: Sprite
    layers:
      - state: icon
        map: ["enum.OpenableVisuals.Layer"]
      - state: potency

- type: entity
  parent: NCFertilizerBag
  id: NCFertilizerBagNutriment
  name: ent-NCFertilizerNutrient
  description: ent-NCFertilizerPotent-desc
  suffix: мешок удобрений
  components:
  - type: SolutionContainerManager
    solutions:
      drink:
        reagents:
        - ReagentId: Nutriment
          Quantity: 30
        - ReagentId: Sugar
          Quantity: 20
  - type: Sprite
    layers:
      - state: icon
        map: ["enum.OpenableVisuals.Layer"]
      - state: nutriment
