
- type: entity
  parent: BaseItem
  id: NCProgramBase
  name: программа нетраннинга
  abstract: true
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Tiny
  - type: Tag
    tags:
    - NCProgramCartridge
  - type: NetProgram
    programType: Network
    ramCost: 1
    energyCost: 0
    duration: 5.0

