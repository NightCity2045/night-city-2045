- type: entity
  parent: BaseItem
  id: NCDataShard
  name: META data shard
  description: Encrypted shard that stores META source and bytecode.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    sourceCode: |
      // Diagnostics v1.0
      ALLOC RAM [2];
      SYS.LOG("Initializing META runtime...");
      
      FOR (DEF INT i = 0; i < 3; i += 1) {
          SYS.LOG("Self-test: Tick " + i);
          YIELD [500];
      }
      
      SYS.LOG("Diagnostics complete.");
      FREE RAM [2];
      EXIT [0];

- type: entity
  parent: BaseItem
  id: NCDataShardDefensive
  name: META defensive shard
  description: Defensive daemon script shard for intrusion response.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    programKind: DaemonDefensive
    sourceCode: |
      // 'Liche' v1.0 - Defensive Daemon
      ON_EVENT("INTRUSION") {
          DEF PTR intr = SYS.GET_INTRUDER();
          IF (SYS.IS_VALID(intr) == 1) {
              SYS.LOG("INTRUSION DETECTED. Executing Neuro-burn...");
              SYS.BURN_NEUROPORT(intr, 15);
              
              YIELD [1000]; // Delay before forced disconnect
              
              SYS.LOG("Initiating forced Dumpshock...");
              SYS.DISCONNECT(intr);
          }
      }

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorCracker
  name: "META: 'Open Sesame'"
  description: A basic script that forces a targeted door to open.
  components:
  - type: DataShard
    sourceCode: |
      // 'Sesame' v2.1 - MagLock Bypass
      ALLOC RAM [4];
      DEF PTR port = SYS.GET_TARGET();

      IF (SYS.IS_VALID(port) == 1) {
          SYS.LOG("Targeting MagLock system...");
          YIELD [1500]; 
          
          SYS.OVERRIDE(port, "DOOR_STATE", 1);
          SYS.OVERRIDE(port, "DOOR_BOLT", 0);
          SYS.LOG("MagLock bypassed. Door open.");
      } ELSE {
          SYS.LOG("ERROR: Link failed. No valid target.");
      }

      FREE RAM [4];
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardChainReaction
  name: "META: 'Cascade'"
  description: Viral script that propagates a ping through the network.
  components:
  - type: DataShard
    sourceCode: |
      // 'Cascade' v0.9 - Network Ping Propagation
      ALLOC RAM [10];
      DEF PTR origin = SYS.GET_TARGET();
      
      IF (SYS.IS_VALID(origin) == 1) {
          DEF ARR nodes = SYS.GET_CONNECTED(origin);
          DEF INT size = SYS.ARR_LENGTH(nodes);
          SYS.LOG("Network scan: " + size + " nodes found.");
          
          FOR (DEF INT i = 0; i < size; i += 1) {
              DEF PTR current = nodes[i];
              IF (SYS.IS_VALID(current) == 1) {
                  SYS.PING(current);
                  SYS.LOG("Pinging node: " + i);
              }
              YIELD [200];
          }
      }
      
      FREE RAM [10];
      EXIT [0];
