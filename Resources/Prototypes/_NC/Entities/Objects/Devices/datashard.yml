- type: entity
  parent: BaseItem
  id: NCDataShard
  name: META data shard
  description: Encrypted shard that stores META source and bytecode.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    sourceCode: |
      // Diagnostics v1.0
      ALLOC RAM [2];
      SYS.LOG("Initializing META runtime...");
      
      FOR (DEF INT i = 0; i < 3; i += 1) {
          SYS.LOG("Self-test: Tick " + i);
          YIELD [500];
      }
      
      SYS.LOG("Diagnostics complete.");
      FREE RAM [2];
      EXIT [0];

- type: entity
  parent: BaseItem
  id: NCDataShardDefensive
  name: META defensive shard
  description: Defensive daemon script shard for intrusion response.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    programKind: DaemonDefensive
    sourceCode: |
      // 'Liche' v1.0 - Defensive Daemon
      ON_EVENT("INTRUSION") {
          DEF PTR intr = SYS.GET_INTRUDER();
          IF (SYS.IS_VALID(intr) == 1) {
              SYS.LOG("INTRUSION DETECTED. Executing Neuro-burn...");
              SYS.BURN_NEUROPORT(intr, 15);
              SYS.LOG("Initiating forced Dumpshock...");
              SYS.DISCONNECT(intr);
          }
      }

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorCracker
  name: "META: 'Open Sesame'"
  description: A basic script that forces a targeted door to open.
  components:
  - type: DataShard
    sourceCode: |
      // 'Sesame' v2.1 - MagLock Bypass
      ALLOC RAM [4];
      DEF PTR port = SYS.GET_TARGET();

      IF (SYS.IS_VALID(port) == 1) {
          SYS.LOG("Targeting MagLock system...");
          YIELD [1500]; 
          
          SYS.OVERRIDE(port, "DOOR_STATE", 1);
          SYS.OVERRIDE(port, "DOOR_BOLT", 0);
          SYS.LOG("MagLock bypassed. Door open.");
      } ELSE {
          SYS.LOG("ERROR: Link failed. No valid target.");
      }

      FREE RAM [4];
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardChainReaction
  name: "META: 'Cascade'"
  description: Viral script that propagates a ping through the network.
  components:
  - type: DataShard
    sourceCode: |
      // 'Cascade' v0.9 - Network Ping Propagation
      ALLOC RAM [10];
      DEF PTR origin = SYS.GET_TARGET();
      
      IF (SYS.IS_VALID(origin) == 1) {
          DEF ARR nodes = SYS.GET_CONNECTED(origin);
          DEF INT size = SYS.ARR_LENGTH(nodes);
          SYS.LOG("Network scan: " + size + " nodes found.");
          
          FOR (DEF INT i = 0; i < size; i += 1) {
              DEF PTR current = nodes[i];
              IF (SYS.IS_VALID(current) == 1) {
                  SYS.PING(current);
                  SYS.LOG("Pinging node: " + i);
              }
              YIELD [200];
          }
      }
      
      FREE RAM [10];
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorToggle
  name: "META: Переключатель шлюза"
  description: Простой боевой скрипт для открытия или закрытия выбранного шлюза.
  components:
  - type: DataShard
    requiredRam: 5
    sourceCode: |
      // Door Toggle - базовый контроль шлюза
      ALLOC RAM [5];
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Переключаю состояние шлюза.");
          SYS.OVERRIDE(door, "DOOR_TOGGLE", 1);
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      FREE RAM [5];
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorCrushLoop
  name: "META: Давилка шлюза"
  description: Заставляет выбранный шлюз несколько раз открываться и резко закрываться.
  components:
  - type: DataShard
    requiredRam: 8
    sourceCode: |
      // Door Crush Loop - принудительный цикл створок
      ALLOC RAM [8];
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Запускаю цикл створок.");
          FOR (DEF INT i = 0; i < 5; i += 1) {
              IF (SYS.IS_VALID(door) == 1) {
                  SYS.OVERRIDE(door, "DOOR_OPEN", 1);
                  YIELD [250];
                  SYS.OVERRIDE(door, "DOOR_OPEN", 0);
                  YIELD [250];
              }
          }
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      FREE RAM [8];
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorShortCircuit
  name: "META: Короткое замыкание"
  description: Перегружает выбранный шлюз, выбивает питание и создает тепловую дугу рядом с дверью.
  components:
  - type: DataShard
    requiredRam: 6
    sourceCode: |
      // Short Circuit - аварийная перегрузка шлюза
      ALLOC RAM [6];
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Перегружаю питание шлюза.");
          YIELD [500];
          SYS.OVERRIDE(door, "SHORT_CIRCUIT", 35);
          SYS.LOG("Короткое замыкание выполнено.");
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      FREE RAM [6];
      EXIT [0];
