- type: entity
  parent: BaseItem
  id: NCDataShard
  name: META data shard
  description: Encrypted shard that stores META source and bytecode.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    sourceCode: |
      // Diagnostics v1.0
      SYS.LOG("Initializing META runtime...");
      
      FOR (DEF INT i = 0; i < 3; i += 1) {
          SYS.LOG("Self-test: Tick " + i);
          YIELD [500];
      }
      
      SYS.LOG("Diagnostics complete.");
      EXIT [0];

- type: entity
  parent: BaseItem
  id: NCDataShardDefensive
  name: META defensive shard
  description: Defensive daemon script shard for intrusion response.
  components:
  - type: Sprite
    sprite: Objects/Devices/cartridges.rsi
    state: cart
  - type: Item
    size: Small
  - type: DataShard
    programKind: DaemonDefensive
    sourceCode: |
      // 'Liche' v1.0 - Defensive Daemon
      ON_EVENT("INTRUSION") {
          DEF PTR intr = SYS.GET_INTRUDER();
          IF (SYS.IS_VALID(intr) == 1 && SYS.IS_NETWORK_ADMIN(intr) == 0) {
              SYS.LOG("INTRUSION DETECTED. Charging Neuro-burn...");
              YIELD [1500];
              SYS.BURN_NEUROPORT(intr, 15);
              SYS.LOG("Neuro-burn delivered. Preparing forced Dumpshock...");
              YIELD [750];
              SYS.DISCONNECT(intr);
          }
      }

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorCracker
  name: "META: 'Open Sesame'"
  description: A basic script that forces a targeted door to open.
  components:
  - type: DataShard
    sourceCode: |
      // 'Sesame' v2.1 - MagLock Bypass
      DEF PTR port = SYS.GET_TARGET();

      IF (SYS.IS_VALID(port) == 1) {
          SYS.LOG("Targeting MagLock system...");
          YIELD [1500]; 
          
          SYS.OVERRIDE(port, "DOOR_STATE", 1);
          SYS.OVERRIDE(port, "DOOR_BOLT", 0);
          SYS.LOG("MagLock bypassed. Door open.");
      } ELSE {
          SYS.LOG("ERROR: Link failed. No valid target.");
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardChainReaction
  name: "META: 'Cascade'"
  description: Viral script that propagates a ping through the network.
  components:
  - type: DataShard
    sourceCode: |
      // 'Cascade' v0.9 - Network Ping Propagation
      DEF PTR origin = SYS.GET_TARGET();
      
      IF (SYS.IS_VALID(origin) == 1) {
          DEF ARR nodes = SYS.GET_CONNECTED(origin);
          DEF INT size = SYS.ARR_LENGTH(nodes);
          SYS.LOG("Network scan: " + size + " nodes found.");
          
          FOR (DEF INT i = 0; i < size; i += 1) {
              DEF PTR current = nodes[i];
              IF (SYS.IS_VALID(current) == 1) {
                  SYS.PING(current);
                  SYS.LOG("Pinging node: " + i);
              }
              YIELD [200];
          }
      }
      
      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardEmergencyDisconnect
  name: "META: Emergency Disconnect"
  description: A last-resort response script that cuts the active link before hostile ICE completes its chain.
  components:
  - type: DataShard
    sourceCode: |
      // Emergency Disconnect - cancels the pending intrusion at the cost of dumpshock.
      DEF PTR deck = SYS.GET_SELF();
      SYS.LOG("Emergency link termination requested.");
      SYS.DISCONNECT(deck);
      EXIT [1];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorToggle
  name: "META: Переключатель шлюза"
  description: Простой боевой скрипт для открытия или закрытия выбранного шлюза.
  components:
  - type: DataShard
    sourceCode: |
      // Door Toggle - базовый контроль шлюза
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Переключаю состояние шлюза.");
          SYS.OVERRIDE(door, "DOOR_TOGGLE", 1);
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorCrushLoop
  name: "META: Давилка шлюза"
  description: Заставляет выбранный шлюз несколько раз открываться и резко закрываться.
  components:
  - type: DataShard
    sourceCode: |
      // Door Crush Loop - принудительный цикл створок
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Запускаю цикл створок.");
          FOR (DEF INT i = 0; i < 5; i += 1) {
              IF (SYS.IS_VALID(door) == 1) {
                  SYS.OVERRIDE(door, "DOOR_OPEN", 1);
                  YIELD [250];
                  SYS.OVERRIDE(door, "DOOR_OPEN", 0);
                  YIELD [250];
              }
          }
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDoorShortCircuit
  name: "META: Короткое замыкание"
  description: Перегружает выбранный шлюз, выбивает питание и создает тепловую дугу рядом с дверью.
  components:
  - type: DataShard
    sourceCode: |
      // Short Circuit - аварийная перегрузка шлюза
      DEF PTR door = SYS.GET_TARGET();

      IF (SYS.IS_VALID(door) == 1) {
          SYS.LOG("Перегружаю питание шлюза.");
          YIELD [500];
          SYS.OVERRIDE(door, "SHORT_CIRCUIT", 35);
          SYS.LOG("Короткое замыкание выполнено.");
      } ELSE {
          SYS.LOG("ОШИБКА: цель недоступна.");
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardIceSentry
  name: "META: ICE Sentry"
  description: A standard META program that materializes static ICE in the current local-network room.
  components:
  - type: DataShard
    sourceCode: |
      // ICE Sentry remains an ordinary META program.
      REQUIRE TARGET [0];

      DEF PTR server = SYS.GET_SERVER();
      DEF PTR ice = SYS.SPAWN_ICE(server, 75);

      IF (SYS.IS_VALID(ice) == 1) {
          SYS.LOG("ICE materialized in the current room.");
      }

      ON_EVENT("INTRUSION") {
          DEF PTR intruder = SYS.GET_INTRUDER();
          IF (
              SYS.IS_VALID(intruder) == 1 &&
              SYS.IS_PROGRAM_OWNER(intruder) == 0 &&
              SYS.IS_NETWORK_ADMIN(intruder) == 0
          ) {
              SYS.LOG("ICE acquired an intruder.");
              YIELD [750];
              SYS.BURN_NEUROPORT(intruder, 10);
          }
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardNetWall
  name: "META: Wall"
  description: Materializes a barrier that only its owner and local-network administrators can cross.
  components:
  - type: DataShard
    sourceCode: |
      // Materialize the wall one tile north of the current avatar.
      REQUIRE TARGET [0];

      DEF PTR server = SYS.GET_SERVER();
      DEF PTR wall = SYS.SPAWN_WALL(server, 0, -1);

      IF (SYS.IS_VALID(wall) == 1) {
          // Passage policy is part of this META program, not the wall runtime.
          SYS.WALL_ALLOW_OWNER(wall, 1);
          SYS.WALL_ALLOW_ADMINS(wall, 1);
          SYS.LOG("Selective NET wall materialized.");
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardNetTrap
  name: "META: Trap"
  description: Materializes a reusable trap that stuns an intruder and burns their neural link.
  components:
  - type: DataShard
    sourceCode: |
      // The trap is placed under the current avatar and remains an ordinary META program.
      REQUIRE TARGET [0];

      DEF PTR server = SYS.GET_SERVER();
      DEF PTR trap = SYS.SPAWN_TRAP(server, 0, 0);

      ON_EVENT("INTRUSION") {
          DEF PTR intruder = SYS.GET_INTRUDER();

          IF (
              SYS.IS_VALID(intruder) == 1 &&
              SYS.IS_PROGRAM_OWNER(intruder) == 0 &&
              SYS.IS_NETWORK_ADMIN(intruder) == 0
          ) {
              YIELD [250];
              SYS.STUN_AVATAR(intruder, 5000);
              SYS.BURN_NEUROPORT(intruder, 10);
          }
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardBlackIce
  name: "META: Black ICE"
  description: Materializes Black ICE whose lethal response is entirely defined by META.
  components:
  - type: DataShard
    sourceCode: |
      REQUIRE TARGET [0];

      DEF PTR server = SYS.GET_SERVER();
      DEF PTR ice = SYS.SPAWN_BLACK_ICE(server, 125);

      ON_EVENT("INTRUSION") {
          DEF PTR intruder = SYS.GET_INTRUDER();

          IF (
              SYS.IS_VALID(intruder) == 1 &&
              SYS.IS_PROGRAM_OWNER(intruder) == 0 &&
              SYS.IS_NETWORK_ADMIN(intruder) == 0
          ) {
              SYS.LOG("Black ICE is charging a lethal response.");
              YIELD [500];
              SYS.BURN_NEUROPORT(intruder, 25);
              SYS.DISCONNECT(intruder);
          }
      }

      EXIT [0];

- type: entity
  parent: NCDataShard
  id: NCDataShardDemonWatcher
  name: "META: Watcher Demon"
  description: Materializes a demon whose detection and attack are entirely defined by META.
  components:
  - type: DataShard
    sourceCode: |
      REQUIRE TARGET [0];

      DEF PTR server = SYS.GET_SERVER();
      DEF PTR demon = SYS.SPAWN_DEMON(server, 100);

      ON_EVENT("INTRUSION") {
          DEF PTR intruder = SYS.GET_INTRUDER();

          IF (
              SYS.IS_VALID(intruder) == 1 &&
              SYS.IS_PROGRAM_OWNER(intruder) == 0 &&
              SYS.IS_NETWORK_ADMIN(intruder) == 0
          ) {
              SYS.LOG("Watcher demon acquired an unauthorized process.");
              DEF PTR self = SYS.GET_SELF();
              SYS.DEMON_FOLLOW(self, intruder);

              WHILE (
                  SYS.IS_VALID(intruder) == 1 &&
                  SYS.IS_IN_RANGE(self, intruder, 1) == 0
              ) {
                  YIELD [250];
              }

              IF (SYS.IS_IN_RANGE(self, intruder, 1) == 1) {
                  SYS.BURN_NEUROPORT(intruder, 15);
              }

              SYS.DEMON_STOP(self);
          }
      }

      EXIT [0];
