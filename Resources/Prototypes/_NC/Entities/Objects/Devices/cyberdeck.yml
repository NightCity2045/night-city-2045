- type: entity
  parent: BaseItem
  id: NCCyberdeck
  name: cyberdeck
  description: A portable netrunning deck for executing META scripts.
  components:
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    state: pda-bartender
    layers:
    - state: pda-bartender
  - type: Item
    size: Large
  - type: Cyberdeck
    maxRam: 64
    currentRam: 64
    recoverySpeed: 4
    scanRadius: 12
    range: 12
  - type: Wieldable
    autoWield: false
  - type: SpeedModifiedOnWield
    walkModifier: 0.9
    sprintModifier: 1
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
        whitelist:
          components:
          - PowerCell
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatterySelfRecharger
    autoRecharge: true
    active: true
