- type: entity
  parent: BaseItem
  id: NCCyberdeckScrap
  name: street-junk cyberdeck
  description: A jury-rigged netrunning deck made of salvaged parts. It lacks proper cooling and safety fuses.
  components:
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    state: pda-bartender
  - type: Item
    size: Large
  - type: UserInterface
    interfaces:
      enum.Content.Shared._NC.Netrunning.Components.CyberdeckUiKey.Key:
        type: Content.Client._NC.Netrunning.UI.CyberdeckBoundUserInterface
  - type: Cyberdeck
    maxShards: 2
    maxRam: 15
    currentRam: 15
    recoverySpeed: 1
    scanRadius: 6
    range: 6
    gasLimit: 1000
    beamColor: "#FF4500"
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatterySelfRecharger
    autoRecharge: true

- type: entity
  parent: BaseItem
  id: NCCyberdeck
  name: corporate cyberdeck
  description: A professional-grade cyberdeck used by high-end mercs. Reliable and well-balanced.
  components:
  - type: Sprite
    sprite: Objects/Devices/pda.rsi
    state: pda-detective
  - type: Item
    size: Large
  - type: UserInterface
    interfaces:
      enum.Content.Shared._NC.Netrunning.Components.CyberdeckUiKey.Key:
        type: Content.Client._NC.Netrunning.UI.CyberdeckBoundUserInterface
  - type: Cyberdeck
    maxShards: 4
    maxRam: 40
    currentRam: 40
    recoverySpeed: 3
    scanRadius: 12
    range: 12
    gasLimit: 5000
    beamColor: "#00BFFF"
  - type: Battery
    maxCharge: 1000
