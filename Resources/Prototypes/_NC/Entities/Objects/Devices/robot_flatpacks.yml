# Abstract faction bases keep the visual identity of packed rigger drones data-driven.
- type: entity
  abstract: true
  parent: BaseFlatpack
  id: NCBaseBiotechnicaRobotFlatpack
  components:
  - type: Sprite
    layers:
    - state: base
    - state: overlay
      color: "#61C49A"
    - state: icon-default

- type: entity
  abstract: true
  parent: BaseFlatpack
  id: NCBaseMilitechRobotFlatpack
  components:
