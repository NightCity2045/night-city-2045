      weight: 2.0
    - type: PhysicalArmor
      stoppingPower: 14
      maxDurability: 80
      currentDurability: 80
      materialType: Kevlar
      bluntDamageMultiplier: 0.8
      durabilityDamageMultiplier: 1
      coverage:
      - Torso
      - LeftArm
      - RightArm
    - type: ItemSlots
      slots:
        armor_plate_1:
          name: armor-plate-slot-name
          insertOnInteract: true
          whitelist:
            components:
            - PhysicalArmor

