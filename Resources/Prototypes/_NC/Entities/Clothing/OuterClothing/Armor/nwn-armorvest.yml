  suffix: NC; Night City; Trupozarka
  components:
    - type: Sprite
      sprite: _NC/Clothing/OuterClothing/Armor/nwn-armorvest.rsi
    - type: Clothing
      sprite: _NC/Clothing/OuterClothing/Armor/nwn-armorvest.rsi
