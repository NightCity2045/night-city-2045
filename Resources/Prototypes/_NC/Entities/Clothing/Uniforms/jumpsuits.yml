- type: entity
  parent: ClothingUniformBase
  id: ClothingUniformJumpsuitArmoredBusinessSuit
  name: kevlar business suit
  description: A tailored business suit with concealed kevlar reinforcement. It will not replace real armor, but it can turn a stray low-grade round into bruises instead of a funeral.
  components:
  - type: Sprite
    sprite: _NC/Clothing/Uniforms/Jumpsuits/armored_business_suit.rsi
  - type: Clothing
    sprite: _NC/Clothing/Uniforms/Jumpsuits/armored_business_suit.rsi
  - type: NCWeight
    weight: 1.8
  - type: PhysicalArmor
    stoppingPower: 22
    maxDurability: 90
    currentDurability: 90
    materialType: Kevlar
    bluntDamageMultiplier: 0.85
    durabilityDamageMultiplier: 1
    coverage:
    - Torso
    - Groin
    - LeftArm
    - RightArm
    - LeftLeg
    - RightLeg

