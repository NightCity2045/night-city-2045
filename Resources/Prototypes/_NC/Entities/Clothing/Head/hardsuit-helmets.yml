# Trauma Team Hardsuit Helmets
# Paramedic / Medic Helmet
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitTraumaTeamMedic
  name: Trauma Team medic hardsuit helmet
  description: A sealed Trauma Team medic helmet with an integrated light and ceramic face protection. It is meant to keep the wearer alive through evacuation, not to win a street war alone.
  components:
  - type: Sprite
    sprite: _NC/Clothing/Head/Hardsuits/trauma_med_helmet.rsi
  - type: Clothing
    sprite: _NC/Clothing/Head/Hardsuits/trauma_med_helmet.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: PointLight
    color: "#adf1ff"
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PressureProtection
    highPressureMultiplier: 0.6
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.9
        Radiation: 0.9
        Caustic: 0.8
  - type: PhysicalArmor
    stoppingPower: 42
    maxDurability: 120
    currentDurability: 120
    materialType: Ceramic
    bluntDamageMultiplier: 0.1
    durabilityDamageMultiplier: 1.25
    coverage:
    - Head

# Operative / Armored Helmet
- type: entity
  parent: [ ClothingHeadHardsuitBase, ClothingHeadSuitWithLightBase ]
  id: ClothingHeadHelmetHardsuitTraumaTeamOperative
  name: Trauma Team assault hardsuit helmet
  description: A reinforced Trauma Team assault helmet with a steel ballistic shell, pressure seals, and combat optics. Expensive, heavy, and built for hot extractions under live fire.
  components:
  - type: Sprite
    sprite: _NC/Clothing/Head/Hardsuits/trauma_armored_helmet.rsi
    layers:
    - state: icon
    - state: icon-on
      map: [ "light" ]
      visible: false
  - type: Clothing
    sprite: _NC/Clothing/Head/Hardsuits/trauma_armored_helmet.rsi
    clothingVisuals:
      head:
      - state: off-equipped-HELMET
  - type: PointLight
    color: "#ff0000" # Red light for operative? Or stick to white/blue? Blue is standard for medical. Let's use blue/cyan to match faction. Actually trauma team often has red accents.
  - type: ToggleableLightVisuals
    spriteLayer: light
    clothingVisuals:
      head:
      - state: on-equipped-HELMET
  - type: PressureProtection
    highPressureMultiplier: 0.3
    lowPressureMultiplier: 1000
  - type: Armor
    modifiers:
      coefficients:
        Heat: 0.8
        Radiation: 0.8
        Caustic: 0.8
  - type: PhysicalArmor
    stoppingPower: 64
    maxDurability: 180
    currentDurability: 180
    materialType: Steel
    bluntDamageMultiplier: 0.35
    durabilityDamageMultiplier: 0.5
    coverage:
    - Head
  - type: FlashImmunity
  - type: FlashSoundSuppression
  - type: EyeProtection
