- type: entity
  id: NCTraumaComputer
  parent: BaseComputer
  name: ent-NCTraumaComputer
  description: ent-NCTraumaComputer-desc
  components:
  - type: TraumaComputer
  - type: CitiNetMap
    visibleGroups: ["Public", "TraumaTeam"]
  - type: ActivatableUI
    key: enum.TraumaComputerUiKey.Key
  - type: UserInterface
    interfaces:
      enum.TraumaComputerUiKey.Key:
        type: TraumaComputerBoundUserInterface

- type: entity
  parent: BaseComputer
  id: NCRiggerConsole
  name: ent-NCRiggerConsole
  description: ent-NCRiggerConsole-desc
  components:
  - type: RiggerConsole
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: security
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#2ecc71"
  - type: Computer
    board: StationRecordsComputerCircuitboard
  - type: AccessReader
    access:
      - ["Biotech_Tech"]
      - ["Biotech_Operative"]

- type: entity
  parent:
  - Incorporeal
  - BaseMob
  id: NCRiggerEye
  name: ent-NCRiggerEye
  description: ent-NCRiggerEye-desc
  categories: [ HideSpawnMenu, DoNotMap ]
  components:
  - type: Sprite
    sprite: Mobs/Silicon/station_ai.rsi
    layers:
    - state: ai_camera
      shader: unshaded
      map: ["base"]
  - type: Input
    context: "human"
  - type: Eye
    drawFov: false
    pvsScale: 1.5
  - type: UserInterface
    interfaces:
      enum.ListViewSelectorUiKey.Key:
        type: ListViewSelectorBUI
  - type: RiggerConsoleUser

- type: entity
  parent: BaseComputerAiAccess
  id: ComputerOverwatch
  name: ent-ComputerOverwatch
  description: ent-ComputerOverwatch-desc
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: security
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#1f8c28"
  - type: Computer
    board: StationRecordsComputerCircuitboard
  - type: ActivatableUI
    key: enum.OverwatchConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.OverwatchConsoleUiKey.Key:
        type: OverwatchConsoleBoundUserInterface
      enum.SurveillanceCameraMonitorUiKey.Key:
        type: SurveillanceCameraMonitorBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: SurveillanceCameraMonitor
  - type: OverwatchConsole
  - type: CitiNetMap
    visibleGroups: ["Public", "NCPD"]
  - type: AccessReader
    access:
      - ["NCPD_Patrol"]
      - ["NCPD_Armory"]
      - ["NCPD_Detective"]
      - ["NCPD_Command"]
  - type: ApcPowerReceiver
  - type: LogicPowerReceiver
    powerLoad: 1000
