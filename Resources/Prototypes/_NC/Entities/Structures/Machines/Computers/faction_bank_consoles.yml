- type: entity
  id: NCConsoleTraumaTeam
  parent: NCBaseFactionBankConsole
  name: ent-NCConsoleTraumaTeam
  components:
  - type: FactionBankConsole
    bankAccount: TraumaTeam
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: medcomp
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: AccessReader
    access: [["Trauma_Command"]]

- type: entity
  id: NCConsoleMilitech
  parent: NCBaseFactionBankConsole
  name: ent-NCConsoleMilitech
  components:
  - type: FactionBankConsole
    bankAccount: Militech
    acceptsRawData: true
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: security
    - map: ["computerLayerKeys"]
      state: generic_keys

- type: entity
  id: NCConsoleBiotechnica
  parent: NCBaseFactionBankConsole
  name: ent-NCConsoleBiotechnica
  components:
  - type: FactionBankConsole
    bankAccount: Biotechnica
    acceptsRawData: true
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: rdcomp
    - map: ["computerLayerKeys"]
      state: generic_keys
  - type: AccessReader
    access: [["Biotech_Director"]]
