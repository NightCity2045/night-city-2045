- type: entity
  id: NCMetaDefenseNode
  parent: BaseMachinePowered
  name: meta defense node
  description: A protected network node with embedded defensive daemon.
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    state: server
  - type: ApcPowerReceiver
    powerLoad: 150
  - type: ExtensionCableReceiver
  - type: Anchorable
  - type: IceHealth
    maxHealth: 120
    currentHealth: 120
  - type: DefensiveDaemon
  - type: ItemSlots
    slots:
      daemon_shard:
        name: Daemon Shard
        startingItem: NCDataShardDefensive
        whitelist:
          components:
          - DataShard
  - type: ContainerContainer
    containers:
      daemon_shard: !type:ContainerSlot
