# Night City lighting palette from the visual design reference.
# Fixtures reuse the stock PoweredLight ECS behavior and RSI states.

- type: entity
  id: NCBasePaletteLightTube
  parent: BaseLightTube
  abstract: true
  components:
  - type: LightBulb
    bulb: Tube
    lightEnergy: 1.5
    lightRadius: 8
    lightSoftness: 1.2
    BurningTemperature: 350
    PowerUse: 25

- type: entity
  id: NCBasePalettePoweredLight
  parent: Poweredlight
  abstract: true
  components:
  - type: PointLight
    radius: 8
    energy: 1.5
    softness: 1.2

