- type: entity
  id: NetDataGate
  name: Global Data Gate
  description: A specialized portal entity that connects local networks to the Global NET.
  components:
  - type: Sprite
    sprite: Structures/Machines/telepad.rsi
    state: idle
    color: "#00ffff"
  - type: PointLight
    enabled: true
    color: "#00ffff"
    radius: 2.0
    energy: 1.5
  - type: InteractionOutline
  - type: NetDataGate
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
