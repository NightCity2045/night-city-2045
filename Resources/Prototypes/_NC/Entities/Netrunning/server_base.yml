- type: entity
  parent: BaseStructure
  id: NetServerBase
  name: local network server
  description: A central hub for a localized digital network. Must be connected to an LCP via MV cables.
  components:
  - type: Sprite
    sprite: Structures/Machines/server.rsi
    state: server
  - type: NetServer
    maxModules: 3
  - type: ApcPowerReceiver
    powerLoad: 500
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - MachineMask
        layer:
        - MachineLayer
