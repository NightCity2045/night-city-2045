# Militech rigger robots. These are IPC-based drones, not human operatives.

# Robot-only loadouts inherit the combat equipment and add a corporate PDA for door access.
- type: startingGear
  id: NCMilitechRobotGearAvenger
  parent: NCMilitechGearPistol
  equipment:
    id: MilitechRiggerPDA

- type: startingGear
  id: NCMilitechRobotGearBoomer
  parent: NCMilitechGearBoomer
  equipment:
    id: MilitechRiggerPDA

- type: startingGear
  id: NCMilitechRobotGearSaratoga
  parent: NCMilitechGearSaratoga
  equipment:
    id: MilitechRiggerPDA

- type: startingGear
  id: NCMilitechRobotGearCrusher
  parent: NCMilitechGearCrusher
  equipment:
    id: MilitechRiggerPDA

- type: entity
  name: ent-MobNCMilitechRobot
  parent: MobIPC
  id: MobNCMilitechRobot
  description: ent-MobNCMilitechRobot-desc
  abstract: true
  IdleRange: !type:Single 10
  components:
  - type: NpcFactionMember
    factions:
    - NCMilitech
  - type: FactionException
  - type: NPCRetaliation
    attackMemoryLength: 15
  - type: RTSAggressionMode
    currentMode: Peaceful
    peacefulFactions:
    - Passive
    normalFactions:
    - NCMilitech
  - type: RiggerDrone
    droneFactions:
    - NCMilitech
    commandRange: 17
  - type: RTSControllable
    attackRange: 8
    attackApproachRange: 1.5
  - type: HTN
    rootTask:
      task: NCBanditTier3RootCompound
  - type: NPCAutoReload
  - type: InputMover
  - type: MobMover

- type: entity
  parent: MobNCMilitechRobot
  id: MobNCMilitechRobotAvenger
  suffix: Militech Robot Avenger
  components:
  - type: Loadout
    prototypes: [NCMilitechRobotGearAvenger]

- type: entity
  parent: MobNCMilitechRobot
  id: MobNCMilitechRobotBoomer
  suffix: Militech Robot Boomer
  components:
  - type: Loadout
    prototypes: [NCMilitechRobotGearBoomer]

- type: entity
  parent: MobNCMilitechRobot
  id: MobNCMilitechRobotSaratoga
  suffix: Militech Robot Saratoga
  components:
  - type: Loadout
    prototypes: [NCMilitechRobotGearSaratoga]

- type: entity
  parent: MobNCMilitechRobot
  id: MobNCMilitechRobotCrusher
  suffix: Militech Robot Crusher
  components:
  - type: Loadout
    prototypes: [NCMilitechRobotGearCrusher]
