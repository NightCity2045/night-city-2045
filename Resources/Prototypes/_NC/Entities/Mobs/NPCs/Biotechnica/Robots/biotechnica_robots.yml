# Biotechnica rigger robots. These are IPC-based drones, not human operatives.

# Robot-only loadouts inherit the combat equipment and add a corporate PDA for door access.
- type: startingGear
  id: NCBiotechnicaRobotGearAvenger
  parent: NCBiotechnicaGearAvenger
  equipment:
    id: BiotechnicaRiggerPDA

- type: startingGear
  id: NCBiotechnicaRobotGearBoomerBuster
  parent: NCBiotechnicaGearBoomerBuster
  equipment:
    id: BiotechnicaRiggerPDA

- type: startingGear
  id: NCBiotechnicaRobotGearSaratoga
  parent: NCBiotechnicaGearSaratoga
  equipment:
    id: BiotechnicaRiggerPDA

- type: startingGear
  id: NCBiotechnicaRobotGearCrusher
  parent: NCBiotechnicaGearCrusher
  equipment:
    id: BiotechnicaRiggerPDA

- type: entity
  name: ent-MobNCBiotechnicaRobot
  parent: MobIPC
  id: MobNCBiotechnicaRobot
  description: ent-MobNCBiotechnicaRobot-desc
  abstract: true
  IdleRange: !type:Single 8
  components:
  - type: NpcFactionMember
    factions:
    - NCBiotechnica
  - type: FactionException
  - type: NPCRetaliation
    attackMemoryLength: 15
  - type: RTSAggressionMode
    currentMode: Peaceful
    peacefulFactions:
    - Passive
    normalFactions:
    - NCBiotechnica
  - type: RiggerDrone
    droneFactions:
    - NCBiotechnica
    commandRange: 17
  - type: RTSControllable
    attackRange: 8
    attackApproachRange: 1.5
  - type: HTN
    rootTask:
      task: NCBanditTier2RootCompound
  - type: NPCAutoReload
  - type: InputMover
  - type: MobMover

- type: entity
  parent: MobNCBiotechnicaRobot
  id: MobNCBiotechnicaRobotAvenger
  suffix: Biotechnica Robot Avenger
  components:
  - type: Loadout
    prototypes: [NCBiotechnicaRobotGearAvenger]

- type: entity
  parent: MobNCBiotechnicaRobot
  id: MobNCBiotechnicaRobotBoomerBuster
  suffix: Biotechnica Robot Boomer
  components:
  - type: Loadout
    prototypes: [NCBiotechnicaRobotGearBoomerBuster]

- type: entity
  parent: MobNCBiotechnicaRobot
  id: MobNCBiotechnicaRobotSaratoga
  suffix: Biotechnica Robot Saratoga
  components:
  - type: Loadout
    prototypes: [NCBiotechnicaRobotGearSaratoga]

- type: entity
  parent: MobNCBiotechnicaRobot
  id: MobNCBiotechnicaRobotCrusher
  suffix: Biotechnica Robot Crusher
  components:
  - type: Loadout
    prototypes: [NCBiotechnicaRobotGearCrusher]
